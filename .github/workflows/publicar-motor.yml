# Publica el MOTOR de WhatsApp solo cuando el motor cambia.
#
# ── POR QUÉ EXISTE ──────────────────────────────────────────────────────────
#
# Esta plataforma se publica en dos sitios y solo uno es automático:
#   · `src/`  → GitHub → Netlify. Solo.
#   · El motor → función de Supabase. A mano, con ./publicar-motor.sh.
#
# Supabase no está suscrita a GitHub: un `git push` no le dice nada. El 4 de
# septiembre de 2026 eso costó una demo — los bloques nuevos aparecían en el
# constructor y en WhatsApp no hacían nada, porque el motor que corría era de
# semanas atrás. Todo «funcionaba» y nada funcionaba.
#
# ── LO QUE NO SE NEGOCIA ────────────────────────────────────────────────────
#
# 1. `revisar-motor.sh` CORRE ANTES. El motor es el único código que se publica
#    a ciegas: no entra en el `tsc` del proyecto ni lo importa ninguna prueba.
#    El 8 de septiembre estuvo a un push de subir dos constantes con el mismo
#    nombre — la función no carga y TODOS los clientes se quedan sin bot a la
#    vez. Automatizar la publicación sin la revisión sería quitar el único
#    control que tiene.
#
# 2. `--no-verify-jwt` NO ES UN DESCUIDO. Quien llama al motor es Meta, que no
#    tiene sesión de Supabase. La puerta la guarda la firma del webhook
#    (`X-Hub-Signature-256`). Publicar con verificación = 401 en cada mensaje =
#    bot mudo para todos a la vez.
#
# 3. SOLO SE DISPARA SI CAMBIÓ EL MOTOR. Publicar en cada push sería publicar
#    veinte veces al día un código que no cambió, y perder la señal de cuándo
#    se publicó de verdad.

name: Publicar el motor de WhatsApp

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/whatsapp/**"
  # Para poder publicarlo a mano desde la pestaña Actions sin tocar el código.
  workflow_dispatch:

# Si llegan dos push seguidos, que no se publiquen a la vez: el último manda.
concurrency:
  group: publicar-motor
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Revisar el motor antes de publicarlo
        run: |
          chmod +x ./revisar-motor.sh
          ./revisar-motor.sh

      - name: Publicar en Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROYECTO: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en el repositorio."
            exit 1
          fi
          npx --yes supabase@latest functions deploy whatsapp \
            --project-ref "${PROYECTO:-stgedtcsuyypzjbxcpoe}" \
            --no-verify-jwt

      - name: Comprobar que lo publicado es lo que dice el repositorio
        run: |
          # La única forma de distinguir «lo publiqué» de «creo que lo publiqué».
          # Si esto falla, sube VERSION_MOTOR: el repositorio y produccion no
          # coinciden y nadie se habría enterado.
          ESPERADA=$(grep -oE 'VERSION_MOTOR = "[^"]+"' supabase/functions/whatsapp/index.ts | head -1 | sed 's/.*"\(.*\)"/\1/')
          VIVA=$(curl -s "https://${PROYECTO:-stgedtcsuyypzjbxcpoe}.supabase.co/functions/v1/whatsapp?version=1" | sed 's/.*"version":"\([^"]*\)".*/\1/')
          echo "repositorio: $ESPERADA · produccion: $VIVA"
          if [ "$ESPERADA" != "$VIVA" ]; then
            echo "::error::El motor publicado dice $VIVA y el repositorio dice $ESPERADA."
            exit 1
          fi
          echo "✅ Motor publicado y comprobado: version $VIVA"
        env:
          PROYECTO: ${{ secrets.SUPABASE_PROJECT_REF }}
